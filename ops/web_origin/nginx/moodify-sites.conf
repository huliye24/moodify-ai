server {
    listen 80;
    listen [::]:80;
    server_name rongjingmusic.com www.rongjingmusic.com;
    root /var/www/rongjingmusic.com/current;
    index index.html;
    access_log /var/log/nginx/rongjingmusic.access.log;
    error_log /var/log/nginx/rongjingmusic.error.log warn;
    add_header X-Moodify-Origin moodify-cloud-103-144-246-242 always;

    location = /api/v1/auditory/jobs {
        limit_req zone=moodify_upload burst=2 nodelay;
        client_max_body_size 52m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location = /api/v1/stems/jobs {
        limit_req zone=moodify_upload burst=2 nodelay;
        client_max_body_size 52m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /api/ {
        limit_req zone=moodify_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","site":"rongjingmusic.com"}\n';
    }
    location ^~ /downloads/ {
        types {
            application/vnd.android.package-archive apk;
            application/zip zip;
        }
        add_header Cache-Control "public, max-age=3600" always;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(css|js|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

server {
    listen 80;
    listen [::]:80;
    server_name play.rongjingmusic.com rongjinwenchuan.xyz www.rongjinwenchuan.xyz;
    access_log /var/log/nginx/rongjinwenchuan.xyz.access.log;
    error_log /var/log/nginx/rongjinwenchuan.xyz.error.log warn;
    add_header X-Moodify-Origin moodify-cloud-103-144-246-242 always;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","site":"moodify-player","service":"moodify-music"}\n';
    }
    location ^~ /audio/ {
        alias /opt/moodify/music-media/audio/;
        types { audio/mpeg mp3; audio/ogg ogg; audio/wav wav; audio/flac flac; audio/mp4 m4a; }
        add_header Cache-Control "public, max-age=3600" always;
        add_header Accept-Ranges bytes always;
    }
    location = /api/v1/music/media {
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }
    location /api/v1/music/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

