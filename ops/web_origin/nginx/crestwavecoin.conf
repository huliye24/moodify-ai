server {
    listen 80;
    listen [::]:80;
    server_name crestwavecoin.com www.crestwavecoin.com;

    access_log /var/log/nginx/crestwavecoin.access.log;
    error_log /var/log/nginx/crestwavecoin.error.log warn;

    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","site":"crestwavecoin.com","origin":"la"}\n';
    }

    location = / {
        return 302 https://$host/token;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
