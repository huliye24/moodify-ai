# nginx reverse proxy — Moodify Studio OS API
# Copy to: /etc/nginx/sites-available/moodify
# Enable:   ln -s /etc/nginx/sites-available/moodify /etc/nginx/sites-enabled/
# Test:     nginx -t && systemctl reload nginx

upstream moodify_api {
    server 127.0.0.1:8700;
    keepalive 32;
}

server {
    listen 80;
    server_name moodify.local;

    # Max upload size for audio files
    client_max_body_size 500M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # API proxy
    location / {
        proxy_pass http://moodify_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts for long audio processing
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Health check — no buffering
    location /health {
        proxy_pass http://moodify_api;
        proxy_buffering off;
    }

    # Studio OS status — short timeout
    location /studio-os/status {
        proxy_pass http://moodify_api;
        proxy_read_timeout 10s;
    }

    # OpenAPI schema — cache for 1 hour
    location /openapi.json {
        proxy_pass http://moodify_api;
        proxy_cache_valid 200 1h;
    }

    # Access log
    access_log /var/log/nginx/moodify-access.log;
    error_log /var/log/nginx/moodify-error.log;
}
