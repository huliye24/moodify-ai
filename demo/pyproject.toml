[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moodify-demo"
version = "0.1.0"
description = "Moodify Intelligence Demo Pipeline — one upload, one Intelligence Report"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
]

[project.scripts]
moodify = "demo.cli:main"

[tool.setuptools]
packages = ["demo", "demo.analyzer", "demo.report"]

[tool.setuptools.package-data]
demo = ["input/*.mp3"]
