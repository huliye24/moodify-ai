# Moodify QA API - Docker Compose
# Development and production orchestration

version: "3.8"

services:
  # ===========================================================================
  # API Service
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: moodify-qa-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MOODIFY_QA_STORAGE_PATH=/app/data/qa_storage.db
      - MOODIFY_QA_UPLOAD_DIR=/app/uploads
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./reports:/app/reports
    networks:
      - moodify-qa-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # PostgreSQL (Optional - for production)
  # ===========================================================================
  # Uncomment for PostgreSQL storage backend
  # db:
  #   image: postgres:15-alpine
  #   container_name: moodify-qa-db
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_USER=moodify
  #     - POSTGRES_PASSWORD=moodify_qa_password
  #     - POSTGRES_DB=moodify_qa
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - moodify-qa-network

  # ===========================================================================
  # Redis (Optional - for Celery task queue)
  # ===========================================================================
  # Uncomment for distributed task processing
  # redis:
  #   image: redis:7-alpine
  #   container_name: moodify-qa-redis
  #   restart: unless-stopped
  #   volumes:
  #     - redis_data:/data
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - moodify-qa-network

  # ===========================================================================
  # Nginx (Optional - for production reverse proxy)
  # ===========================================================================
  # Uncomment for production deployment with SSL
  # nginx:
  #   image: nginx:alpine
  #   container_name: moodify-qa-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - api
  #   networks:
  #     - moodify-qa-network

# =============================================================================
# Networks
# =============================================================================
networks:
  moodify-qa-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
