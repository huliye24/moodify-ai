[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "moodify-bridge"
version = "0.1.0"
description = "Local-first immutable research-production evidence bridge for Moodify"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
dependencies = [
  "duckdb>=1.1,<2",
  "numpy>=2,<3",
  "pyarrow>=17,<22",
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
audio = ["soundfile>=0.12,<1", "pyloudnorm>=0.1.1,<1", "scipy>=1.14,<2"]
dev = ["mypy>=1.11,<2", "pytest>=8,<10", "ruff>=0.6,<1", "types-PyYAML>=6"]

[project.scripts]
moodify-bridge = "moodify_bridge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/moodify_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["moodify_bridge"]
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "yaml"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]  # Typer intentionally declares options as defaults.
