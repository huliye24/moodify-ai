<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moodify EDSR 校准 — A/B 听感测试</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  #app { width: 700px; padding: 40px; background: #161b22; border-radius: 12px; border: 1px solid #30363d; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  .subtitle { color: #8b949e; font-size: 14px; margin-bottom: 24px; }
  .progress { color: #58a6ff; font-size: 13px; margin-bottom: 20px; }
  .player-row { display: flex; gap: 20px; margin-bottom: 24px; }
  .player { flex: 1; text-align: center; }
  .player button { width: 100%; padding: 24px; font-size: 28px; border: 2px solid #30363d; border-radius: 8px; background: #0d1117; color: #c9d1d9; cursor: pointer; transition: all 0.15s; }
  .player button:hover { border-color: #58a6ff; background: #1c2533; }
  .player button.playing { border-color: #3fb950; background: #1a2e1c; }
  .player button:disabled { opacity: 0.4; cursor: not-allowed; }
  .player .label { font-size: 13px; margin-top: 8px; color: #8b949e; }
  .choices { display: flex; gap: 12px; margin-bottom: 16px; }
  .choices button { flex: 1; padding: 12px; font-size: 15px; border: 1px solid #30363d; border-radius: 6px; background: #0d1117; color: #c9d1d9; cursor: pointer; }
  .choices button:hover { border-color: #58a6ff; }
  .choices button.selected { border-color: #3fb950; background: #1a2e1c; }
  .confidence { margin-bottom: 20px; }
  .confidence label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 6px; }
  .confidence input { width: 100%; }
  .confidence .labels { display: flex; justify-content: space-between; font-size: 11px; color: #484f58; }
  #next { width: 100%; padding: 14px; font-size: 16px; border: none; border-radius: 6px; background: #238636; color: #fff; cursor: pointer; }
  #next:disabled { background: #30363d; color: #484f58; cursor: not-allowed; }
  #done { display: none; text-align: center; padding: 40px; }
  #done h2 { color: #3fb950; margin-bottom: 12px; }
  #listener-setup { margin-bottom: 24px; }
  #listener-setup input { width: 100%; padding: 10px; font-size: 15px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; margin-bottom: 8px; }
  #listener-setup button { padding: 10px 24px; font-size: 15px; border: none; border-radius: 6px; background: #238636; color: #fff; cursor: pointer; }
  .hidden { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="listener-setup">
    <h1>Moodify EDSR 校准测试</h1>
    <p class="subtitle">比较 A 和 B 两个版本，选择你更偏好的那个</p>
    <input type="text" id="listener-id" placeholder="输入你的名字或编号" maxlength="20">
    <button onclick="startTest()">开始测试</button>
  </div>

  <div id="test-area" class="hidden">
    <h1>Moodify A/B 听感比较</h1>
    <p class="progress" id="progress"></p>

    <div class="player-row">
      <div class="player">
        <button id="btnA" onclick="play('A')">▶ A</button>
        <div class="label">版本 A</div>
      </div>
      <div class="player">
        <button id="btnB" onclick="play('B')">▶ B</button>
        <div class="label">版本 B</div>
      </div>
    </div>

    <div class="choices">
      <button id="choiceA" onclick="choose('A')">A 更好</button>
      <button id="choiceB" onclick="choose('B')">B 更好</button>
      <button id="choiceTie" onclick="choose('tie')">无差异</button>
    </div>

    <div class="confidence">
      <label>确定程度</label>
      <input type="range" id="conf" min="1" max="5" value="3">
      <div class="labels"><span>不确定</span><span>一般</span><span>非常确定</span></div>
    </div>

    <button id="next" onclick="nextPair()" disabled>选择答案后继续 →</button>
  </div>

  <div id="done">
    <h2>测试完成！</h2>
    <p id="done-msg"></p>
    <p style="margin-top:12px;color:#8b949e">请将下载的 ratings.jsonl 发送给实验组织者</p>
    <button onclick="downloadResults()" style="margin-top:16px;padding:12px 24px;font-size:15px;border:none;border-radius:6px;background:#238636;color:#fff;cursor:pointer">下载结果</button>
  </div>
</div>

<script>
let listenerId = '';
let pairs = [];
let currentPair = 0;
let ratings = [];
let currentAudio = null;
let currentChoice = null;

// 从 versions_metadata.json 和 proxy_scores.json 生成的配对列表
// 在实际运行中, 这个文件由 scripts/prepare_ab_pairs.py 生成

async function loadPairs() {
  const resp = await fetch('ab_pairs.json');
  return resp.json();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

async function startTest() {
  listenerId = document.getElementById('listener-id').value.trim();
  if (!listenerId) { alert('请输入名字'); return; }

  document.getElementById('listener-setup').classList.add('hidden');
  document.getElementById('test-area').classList.remove('hidden');

  pairs = await loadPairs();
  // 插入 2 对隐藏重复 (随机选 2 对在末尾重复)
  const repeats = shuffle([...Array(pairs.length).keys()]).slice(0, 2);
  for (const idx of repeats) pairs.push({...pairs[idx], _repeat: true});
  // 插入 1 对锚定对 (原始 vs extreme — 应该明显偏好 extreme 的反方向)
  const anchor = pairs.find(p => p.type === 'original_vs_extreme');
  if (anchor) pairs.push({...anchor, _anchor: true});

  pairs = shuffle(pairs);
  currentPair = 0;
  ratings = [];
  showPair();
}

function showPair() {
  if (currentPair >= pairs.length) {
    document.getElementById('test-area').classList.add('hidden');
    document.getElementById('done').classList.remove('hidden');
    document.getElementById('done-msg').textContent =
      `完成 ${pairs.length} 对比较, 共 ${ratings.length} 条评价`;
    return;
  }
  const pair = pairs[currentPair];
  document.getElementById('progress').textContent =
    `第 ${currentPair + 1} / ${pairs.length} 对`;
  document.getElementById('btnA').textContent = '▶ A';
  document.getElementById('btnB').textContent = '▶ B';
  document.getElementById('btnA').classList.remove('playing');
  document.getElementById('btnB').classList.remove('playing');
  document.getElementById('choiceA').classList.remove('selected');
  document.getElementById('choiceB').classList.remove('selected');
  document.getElementById('choiceTie').classList.remove('selected');
  document.getElementById('conf').value = 3;
  document.getElementById('next').disabled = true;
  currentChoice = null;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
}

function play(label) {
  if (currentAudio) currentAudio.pause();
  const pair = pairs[currentPair];
  const url = label === 'A' ? pair.audio_a : pair.audio_b;
  currentAudio = new Audio(url);
  currentAudio.play();
  document.getElementById('btnA').classList.toggle('playing', label === 'A');
  document.getElementById('btnB').classList.toggle('playing', label === 'B');
}

function choose(choice) {
  currentChoice = choice;
  document.getElementById('choiceA').classList.toggle('selected', choice === 'A');
  document.getElementById('choiceB').classList.toggle('selected', choice === 'B');
  document.getElementById('choiceTie').classList.toggle('selected', choice === 'tie');
  document.getElementById('next').disabled = false;
}

function nextPair() {
  const pair = pairs[currentPair];
  ratings.push({
    listener_id: listenerId,
    pair_id: `P${String(currentPair).padStart(4,'0')}`,
    audio_a: pair.audio_a,
    audio_b: pair.audio_b,
    version_a: pair.version_a,
    version_b: pair.version_b,
    choice: currentChoice,
    confidence: parseInt(document.getElementById('conf').value),
    is_repeat: pair._repeat || false,
    is_anchor: pair._anchor || false,
    timestamp: new Date().toISOString(),
  });
  currentPair++;
  showPair();
}

function downloadResults() {
  const blob = new Blob([ratings.map(r => JSON.stringify(r)).join('\n')], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ratings_${listenerId}_${new Date().toISOString().slice(0,10)}.jsonl`;
  a.click();
}
</script>
</body>
</html>
