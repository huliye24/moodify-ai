[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moodify"
version = "0.1.0"
description = "Moodify — The Ear of AI: an auditory intelligence system for analyzing, judging, intervening on, verifying, and learning from audio"
authors = [{name = "文川院 / Moodify 声音实验室"}]
license = {text = "GPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "pyloudnorm>=0.1.0",
    "pydantic>=2.0",
    "pedalboard>=0.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.5",
]

[project.optional-dependencies]
dsp = ["pedalboard>=0.9.0"]
separation = ["demucs", "torch>=2.0"]
api = ["fastapi>=0.100.0", "uvicorn", "python-multipart"]
dev = ["pytest>=7.0", "httpx>=0.24.0", "matplotlib>=3.5"]
full = ["moodify[dsp,separation,api,dev]"]

[project.scripts]
moodify = "moodify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "v01: v0.1.0 mainline tests",
    "legacy: old system tests kept for compatibility",
    "experimental: future or research modules not required by v0.1.0",
]
