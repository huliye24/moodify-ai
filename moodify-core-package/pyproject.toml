[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moodify"
version = "2.0.0"
description = "Moodify — The Ear of AI: an auditory intelligence system for analyzing, judging, intervening on, verifying, and learning from audio"
authors = [{name = "文川院 / Moodify 声音实验室"}]
license = {text = "GPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "pyloudnorm>=0.1.0",
    "pydantic>=2.0",
    "pedalboard>=0.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dsp = ["pedalboard>=0.9.0"]
separation = ["demucs", "torch>=2.0"]
transcription = [
    "numpy>=1.24,<2", "scipy>=1.11,<1.14", "librosa>=0.10,<0.11",
    "mir_eval>=0.8,<0.9", "pretty_midi>=0.2.10,<0.3", "resampy>=0.4,<0.4.3",
    "scikit-learn>=1.3,<1.6", "onnxruntime>=1.16,<2; platform_system == 'Windows'",
]
api = ["fastapi>=0.100.0", "uvicorn", "python-multipart"]
# lyric-align ML backend (DSK-MFY-LYRIC-TEMPORAL-ALIGNMENT-001 Phase B).
# Pinned ranges only — installation happens on the GPU/server environment.
ml = ["whisperx>=3.3,<4", "demucs>=4,<5"]
dev = ["pytest>=7.0", "httpx>=0.24.0", "matplotlib>=3.5"]
full = ["moodify[dsp,separation,api,dev]"]

[project.scripts]
moodify = "moodify.cli_v2.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# E701/E702（单行多语句）为风格规则，基线代码大量使用且不影响正确性，
# 本机 ruff 0.15 新默认启用导致全量报错；显式豁免以保持基线稳定。
ignore = ["E701", "E702"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".."]
markers = [
    "v01: legacy v0.1.0 mainline tests",
    "legacy: old system tests kept for compatibility",
    "experimental: future or research modules not required by Workspace v2 MVP",
]
