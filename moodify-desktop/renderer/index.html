<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' file:; style-src 'self'">
  <title>Moodify Studio</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 顶栏：logo + 当前世界 + 事件状态（只在有事发生时出现）。无关闭：世界不关闭，只切换。 -->
  <header id="topbar">
    <img class="logo" src="assets/moodify_logo.png" alt="Moodify">
    <div id="case-title" hidden>
      <div>
        <h1 id="source-name"></h1>
        <p class="muted" id="report-meta"></p>
      </div>
    </div>
    <div class="top-actions">
      <span id="status-line" class="muted" hidden></span>
      <span id="badge-overall" class="badge" hidden></span>
      <span id="badge-decision" class="badge" hidden></span>
    </div>
  </header>

  <div id="main-row">
    <!-- 左图标栏：1 打开 / 2 修音 / 3 世界（时钟=世界历史；视图主体走顶部标签页） -->
    <nav id="rail">
      <button id="rail-open" title="打开音频文件（创建/进入世界）" aria-label="打开音频文件">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 6.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button id="rail-fix" title="修音工作台" aria-label="修音工作台">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 4v16M12 4v16M19 4v16"/><circle cx="5" cy="9" r="2.2"/><circle cx="12" cy="15" r="2.2"/><circle cx="19" cy="7" r="2.2"/></svg>
      </button>
      <button id="rail-history" title="世界（双击进入；时钟=世界历史）" aria-label="世界">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      </button>
    </nav>

    <!-- 世界面板：从左滑出，可收起；双击 = 进入该世界（不关闭当前） -->
    <aside id="history-panel" hidden>
      <div class="list-head">
        <span class="muted">世界（双击进入）</span>
        <button id="refresh" class="ghost">刷新</button>
      </div>
      <table class="data">
        <thead><tr>
          <th>源文件</th><th>分析时间</th><th>状态</th><th>判定</th>
        </tr></thead>
        <tbody id="archive-body"></tbody>
      </table>
      <p class="muted archive-path" id="archive-path"></p>
    </aside>

    <!-- 中央工作区：顶部标签页按来源分——波谱=音乐本身，图表/数据=检测产物 -->
    <main id="workspace">
      <nav id="tabs" hidden>
        <button class="tab" id="tab-wave">波谱</button>
        <button class="tab" id="tab-fix">修音</button>
        <button class="tab" id="tab-charts">图表</button>
        <button class="tab" id="tab-data">数据</button>
      </nav>
      <div id="views">
        <!-- 产品水印：透明底纹，常驻工作区背景层；结果内容叠加其上，不占布局 -->
        <img id="wm" src="assets/moodify_watermark.png" alt="">
        <section id="view-empty" class="workspace-view"></section>

        <section id="view-wave" class="workspace-view" hidden>
          <div id="wave-wrap" hidden>
            <canvas id="waveform" height="150"></canvas>
            <p class="muted caption" id="wave-caption"></p>
          </div>
          <div id="spectrum-body" class="charts"></div>
          <p class="muted caption">音乐的声谱（实测渲染）；不构成审美或平台适配判断。</p>
        </section>

        <section id="view-fix" class="workspace-view" hidden>
          <div id="fix-tracks" class="fix-tracks">
            <div class="track" id="fix-source-track" hidden>
              <div class="track-head">
                <span class="track-name">源</span>
                <span class="muted track-meta" id="fix-meta"></span>
              </div>
              <div class="track-strip"><canvas id="fix-strip" height="88"></canvas></div>
            </div>
          </div>
          <p class="muted caption">源轨（只读）；渲染出的版本以轨道条形式叠加于此。</p>
        </section>

        <section id="view-charts" class="workspace-view" hidden>
          <div id="charts-body" class="charts"></div>
          <p class="muted caption">检测产物：指标实测图；阈值 0/16 已校准（全部 DEFAULT_UNCALIBRATED）——本图不做好坏判断。</p>
        </section>

        <section id="view-data" class="workspace-view" hidden>
          <table class="data">
            <thead><tr><th>指标</th><th>值</th><th>单位</th><th>状态</th><th>组</th></tr></thead>
            <tbody id="measure-body"></tbody>
          </table>
          <h3 class="draft-head">规则草案（保守，DRAFT_PLAN_NOT_EXECUTED）</h3>
          <div id="plan-body"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- 工程终端：默认隐藏，纯工程面（ffmpeg/python/CLI）；无 AI 通道 -->
  <div id="drawer" hidden>
    <div id="drawer-bar" title="拖拽调高度，双击收起">
      <span class="muted" id="term-cwd"></span>
      <span class="drawer-actions">
        <button id="drawer-toggle" class="ghost" title="收起终端">▾</button>
      </span>
    </div>
    <div id="terminal"></div>
  </div>

  <!-- 意图命令条 = Mood 编译器之家：写文字 → DeepSeek 回答与操作；唯一 AI 门 -->
  <div id="intent-dock">
    <div id="compiler-stream" class="compiler-stream" hidden></div>
    <div id="dock-bar" hidden>
      <span class="drawer-actions">
        <button id="compiler-stop" class="ghost" hidden>停止</button>
        <button id="compiler-save" class="ghost" hidden title="把最后一条方案存为 plan.md">保存方案</button>
      </span>
    </div>
    <!-- 首次使用：内核与模型提供方设置（安装时可选，随时可改） -->
    <div id="compiler-setup" class="compiler-setup" hidden>
      <div class="setup-row">
        <label>模型提供方</label>
        <select id="setup-kind">
          <option value="deepseek">DeepSeek</option>
          <option value="openai">OpenAI</option>
          <option value="custom">自定义（OpenAI 兼容）</option>
        </select>
        <label>模型</label>
        <input id="setup-model" type="text" placeholder="deepseek-v4-pro">
        <input id="setup-baseurl" type="text" placeholder="https://…/v1/" hidden>
      </div>
      <div class="setup-row">
        <label>API Key</label>
        <input id="setup-key" type="password" placeholder="粘贴密钥（仅存本机 ~/.moodify/codex）">
        <button id="setup-save" class="primary">保存并启动</button>
      </div>
      <p class="muted caption" id="setup-status"></p>
    </div>
    <p class="muted caption" id="compiler-note" hidden></p>
    <div class="dock-input-row">
      <textarea id="compiler-input" rows="1" title="直接输入，⏎ 发送" disabled></textarea>
      <button id="compiler-send" class="primary" disabled>发送</button>
      <button id="drawer-toggle2" class="ghost" title="工程终端（ffmpeg / python / CLI）">⌘_</button>
    </div>
  </div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="app.js"></script>
</body>
</html>
