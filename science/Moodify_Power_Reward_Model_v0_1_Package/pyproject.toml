[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moodify-power-reward"
version = "0.1.0"
description = "Reproducible engineering pipeline for the Moodify Power Reward Model pilot"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "soundfile>=0.12",
  "pyloudnorm>=0.1",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0"]

[project.scripts]
pwrm = "pwrm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
