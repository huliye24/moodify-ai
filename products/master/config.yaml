# Moodify Master — AI Music Mastering Engine configuration
product:
  name: "Moodify Master"
  full_name: "AI Music Mastering Engine"
  version: "0.1.0"
  api_namespace: "/api/v1/master"

presets:
  built_in:
    - warm_vocal
    - clean_master
    - wide_space
    - streaming_optimized
  defaults:
    target_lufs: -14.0
    true_peak_dbtp: -1.0

intervention:
  identity_gate: enabled
  safety_bounds: enabled
  human_escalation: enabled

reconstruction:
  enabled: true
  objective_based: true

migration:
  status: "PHASE_A_STRUCTURE_CREATED"
  source: "moodify-core-package/src/moodify/"
