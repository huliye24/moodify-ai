name: Moodify Temporal Texture Guard

on:
  pull_request:
  workflow_dispatch:

jobs:
  temporal-texture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run audit
        run: |
          python tools/temporal_texture/temporal_texture_audit.py \
            --repo . \
            --config .moodify/temporal_texture.toml \
            --out artifacts/temporal_texture/current \
            --fail-on error
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-texture-report
          path: artifacts/temporal_texture/current
