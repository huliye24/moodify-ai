name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python 3.11 quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moodify-core-package
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.15.15 pytest
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check src tests ../tests

      - name: Run pytest
        env:
          MPLBACKEND: Agg
          MOODIFY_NODE_STATE_DIR: ${{ runner.temp }}/moodify-state
          MOODIFY_NODE_OUTPUT_ROOT: ${{ runner.temp }}/moodify-data-factory
          MOODIFY_CASES_ROOT: ${{ runner.temp }}/moodify-cases
        run: python -m pytest -q tests ../tests
