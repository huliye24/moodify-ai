name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Android Release Build
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android APK
        working-directory: apps/music-android
        run: |
          ./gradlew assembleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: apps/music-android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename APK with version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir -p deliverables/releases/temp
          cp ${{ steps.sign_app.outputs.signedReleaseFile }} deliverables/releases/temp/Moodify_Music_${VERSION}_Android.apk

      - name: Generate checksums
        working-directory: deliverables/releases/temp
        run: |
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: deliverables/releases/temp/

  # Windows Electron Release Build
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: moodify-pulse/package-lock.json

      - name: Install dependencies
        working-directory: moodify-pulse
        run: npm ci

      - name: Build Electron app
        working-directory: moodify-pulse
        run: npm run build:electron

      - name: Package for Windows
        working-directory: moodify-pulse
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename artifacts with version
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF -replace 'refs/tags/v', ''
          New-Item -ItemType Directory -Force -Path deliverables/releases/temp-win
          $files = Get-ChildItem moodify-pulse/dist/*.exe, moodify-pulse/dist/*.msi, moodify-pulse/dist/*.zip -ErrorAction SilentlyContinue
          foreach ($file in $files) {
            $newName = "Moodify_Music_$($VERSION)_Windows_$($file.Extension.TrimStart('.'))$($file.Extension)"
            Copy-Item $file.FullName "deliverables/releases/temp-win/$newName"
          }

      - name: Generate checksums
        working-directory: deliverables/releases/temp-win
        run: |
          certutil -hashfile *.exe SHA256 > SHA256SUMS.txt 2>nul || true
          certutil -hashfile *.msi SHA256 >> SHA256SUMS.txt 2>nul || true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-electron
          path: deliverables/releases/temp-win/

  # Create GitHub Release and upload assets
  create-release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: deliverables/releases/android/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-electron
          path: deliverables/releases/windows/

      - name: Generate Release Notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "## Moodify Music ${VERSION}" > release_notes.md
          echo "" >> release_notes.md
          echo "### 下载链接" >> release_notes.md
          echo "" >> release_notes.md
          echo "#### Android" >> release_notes.md
          echo "- APK 文件：适用于 Android 8.0+ 设备" >> release_notes.md
          echo "" >> release_notes.md
          echo "#### Windows" >> release_notes.md
          echo "- 安装程序 (.exe)：推荐用于大多数用户" >> release_notes.md
          echo "- 便携版 (.zip)：无需安装，解压即用" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 校验和" >> release_notes.md
          echo "所有文件的 SHA256 校验和包含在 SHA256SUMS.txt 中" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 免责声明" >> release_notes.md
          echo "本软件为实验性产品，仅供研究和测试使用。使用本软件即表示您同意相关服务条款和隐私政策。" >> release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          files: |
            deliverables/releases/android/*.apk
            deliverables/releases/android/SHA256SUMS.txt
            deliverables/releases/windows/*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
