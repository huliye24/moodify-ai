name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Android-only since 2026-10-03 (MOODIFY_NETWORK_RESTRUCTURE_001).
#
# The former `build-windows` job built moodify-pulse and could not succeed:
#   - it set cache-dependency-path to moodify-pulse/package-lock.json, which does
#     not exist (tracked or on disk), so both the setup-node npm cache and the
#     `npm ci` that requires a lockfile were guaranteed to fail;
#   - package.json's build.extraResources pointed at moodify-pulse/backend/
#     moodify-server.exe, which does not exist, and build/ was empty;
#   - moodify-pulse itself was a fourth competing product identity, banned by
#     docs/brand/public/PUBLIC_BRAND_CONSTITUTION.md section 2.2.
# moodify-pulse/ has been removed.
#
# Windows packaging is not restored here. moodify-desktop/ is the surviving shell
# but currently has only `"start": "electron ."` — no electron-builder, no dist
# script, no icons. Repointing this job at it without adding that tooling would
# swap one guaranteed-failing job for another. Recorded as
# HUMAN_DECISION_REQUIRED in docs/restructure/RESTRUCTURE_REPORT.md.
#
# Separately, and pre-existing: `apps/*/gradlew` is stored at git mode 100644 and
# the repo has no .gitattributes, so `./gradlew assembleRelease` below fails with
# Permission denied on ubuntu-latest. That is not introduced by this restructure
# and is recorded in the same report.

jobs:
  # Android Release Build
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android APK
        working-directory: apps/music-android
        run: |
          ./gradlew assembleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: apps/music-android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename APK with version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir -p deliverables/releases/temp
          cp ${{ steps.sign_app.outputs.signedReleaseFile }} deliverables/releases/temp/Moodify_Music_${VERSION}_Android.apk

      - name: Generate checksums
        working-directory: deliverables/releases/temp
        run: |
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: deliverables/releases/temp/

  # Create GitHub Release and upload assets
  create-release:
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: deliverables/releases/android/

      - name: Generate Release Notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "## Moodify Music ${VERSION}" > release_notes.md
          echo "" >> release_notes.md
          echo "### 下载链接" >> release_notes.md
          echo "" >> release_notes.md
          echo "#### Android" >> release_notes.md
          echo "- APK 文件：适用于 Android 8.0+ 设备" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 校验和" >> release_notes.md
          echo "所有文件的 SHA256 校验和包含在 SHA256SUMS.txt 中" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 免责声明" >> release_notes.md
          echo "本软件为实验性产品，仅供研究和测试使用。使用本软件即表示您同意相关服务条款和隐私政策。" >> release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          files: |
            deliverables/releases/android/*.apk
            deliverables/releases/android/SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
