name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build
        run: |
          cd moodify-pulse
          npm ci
          npm run build
