name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build and verify Web Player artifact
        working-directory: apps/web
        run: |
          npm ci
          npm test
