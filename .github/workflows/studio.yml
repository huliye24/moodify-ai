name: Studio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The desktop shell had no automated check at all before this workflow — the static
# contract check existed but only ever ran by hand, so a renderer that referenced a
# missing DOM id or IPC channel could merge silently.
#
# Two layers, deliberately separate:
#   check-contracts.js  static: every DOM id / bridge / IPC channel the renderer uses exists
#   test-studio.js      behavioural: the real Core chain (validate -> process -> evidence)
#                       driven headlessly, exactly as main.js drives it
#
# test-studio.js SKIPS (exit 0) when Core is not importable, so a checkout without the
# Python environment is not reported as broken. Python is set up here so the behavioural
# half actually runs rather than silently skipping.
jobs:
  studio:
    name: Studio contracts and processing chain
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Core
        working-directory: moodify-core-package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install the audio runtime (deep chain)
        # `.venv-audio` 的等价物：numpy + scipy + soundfile，没有 sklearn/pandas。
        # 装它是为了让 test-deep-chain 在 CI 里**真的跑**那条链，而不是如实跳过——
        # 这条链曾经在真实机器上完全不可达而全量测试全绿，原因正是「没有一个测试跑过它」。
        # 刻意不装 librosa/sklearn/pandas：修复的一部分就是让快速分离不再依赖那条会崩的链。
        run: python -m pip install -r moodify-desktop/scripts/requirements-audio.txt

      - name: Static contract check
        working-directory: moodify-desktop
        run: node scripts/check-contracts.js

      - name: Production pipeline (stages, diagnosis, context)
        working-directory: moodify-desktop
        run: node scripts/test-pipeline.js

      - name: Headless processing chain
        working-directory: moodify-desktop
        run: node scripts/test-studio.js

      - name: Deep-chain scripts (separation / reversibility / structure)
        # 这条链曾经在真实机器上完全不可达而没有任何测试发现：脚本 import 了
        # librosa→sklearn→pandas→numpy 这条会崩的链，外部运行时也从未安装。
        # 这个测试真的跑脚本，因此需要 .venv-audio（numpy+scipy+soundfile，很轻）。
        # 缺运行时它**如实跳过**（不是假装通过）。
        working-directory: moodify-desktop
        run: node scripts/test-deep-chain.js

      - name: Release guard (trust chain)
        # 发布是唯一不可撤回的动作，所以守卫本身必须被测到会挡住坏产物集。
        working-directory: moodify-desktop
        run: node scripts/test-release-guard.js
