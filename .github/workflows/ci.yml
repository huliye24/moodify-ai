name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd moodify-core-package
          pip install -e ".[dev]"

      - name: Lint
        run: pip install ruff==0.15.15 && ruff check moodify-core-package/src/moodify

      - name: Test
        run: |
          cd moodify-core-package
          python -m pytest tests/ -v --tb=short
