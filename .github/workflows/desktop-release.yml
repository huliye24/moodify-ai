name: Desktop Release

# 发布链 = 复用 `desktop-sign.yml`（构建 → 签名 → 来源证明），再发布。
#
# 为什么改成复用而不是各建一次：
#   原实现自己跑一遍 `npm run dist:win` 并直接发布**未签名**产物。一旦引入签名，
#   两条构建路径就会产生两个不同的字节序列——而发布的那一条可能是没签名的那条。
#   现在只有一份构建实现，发布动作只能拿到它产出的、已证明来源的产物。
#
# 职责分工：
#   desktop-sign.yml     构建 + 测试 + （可选）签名 + 来源证明 + 验签  ← 唯一构建入口
#   desktop-release.yml   取产物 → 发布 GitHub Release（不重新构建）

on:
  pull_request:
    paths:
      - "moodify-desktop/**"
      - ".github/workflows/desktop-release.yml"
      - ".github/workflows/desktop-sign.yml"
      - "docs/releases/**"
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  # PR 与 tag 都走这一条：PR 上它验证构建与测试，tag 上它额外签名与证明。
  #
  # 权限必须在这里给全：可复用 workflow 的权限**不能超过**调用方授予的上限
  # （GitHub 的行为），所以 `id-token: write` + `attestations: write` 若不在此声明，
  # 被调用 workflow 里的来源证明步骤会直接失败。
  #
  # 代价要说清楚：这两个权限因此覆盖整条链，**包括跑 `npm ci` 的构建 job**，
  # 而不再是只覆盖「只碰字节」的签名 job。这是复用带来的真实让步，
  # 不是无意之举——换来的是「只有一份构建实现」，即不可能出现
  # 「未签名的那一份被发出去」。若日后要收回这个让步，做法是在
  # desktop-sign.yml 内部把证明步骤拆成独立 workflow 并以
  # `workflow_run` 触发（只对已完成的 artifact 操作），而不是放弃单一构建入口。
  build:
    uses: ./.github/workflows/desktop-sign.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  publish:
    name: Publish GitHub Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download signed + attested artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-signed
          path: release

      - name: Release guard — refuse to publish anything unverifiable
        # 逻辑本身在 moodify-desktop/scripts/release-guard.ps1 里，不内联在这里。
        # 理由：内联在 YAML 里的检查**无法被测试**，而一条只在真实发布时才第一次执行的
        # 检查等于没有检查。抽成脚本后，它可以对着合成的失败产物集反复跑
        # （见 scripts/test-release-guard.js），证明它真的会挡住那些情况。
        shell: pwsh
        run: |
          if ("${{ vars.SIGNPATH_ENABLED }}" -eq "true") {
            & ./moodify-desktop/scripts/release-guard.ps1 -ReleaseDir release -SigningEnabled
          } else {
            & ./moodify-desktop/scripts/release-guard.ps1 -ReleaseDir release
          }
          if ($LASTEXITCODE -ne 0) { throw "release guard rejected the artifact set" }

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          name: Moodify Studio ${{ github.ref_name }}
          prerelease: true
          body_path: .github/release-notes/desktop-provenance.md
          files: |
            release/*.exe
            release/RELEASE_MANIFEST.json
            release/SIGNATURE_FACTS.json
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
